<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f0d"/>
      <stop offset="40%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#061210"/>
    </linearGradient>
    <linearGradient id="emerald-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e68a;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00e68a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00e68a;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pulse-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#00e68a" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
  </g>

  <!-- ECG/Heartbeat line -->
  <g transform="translate(0, 0)">
    <polyline fill="none" stroke="#00e68a" stroke-width="2" opacity="0.25" filter="url(#glow)"
      points="500,140 520,140 530,140 540,140 555,140 560,100 565,170 570,80 575,190 580,110 585,140 595,140 610,140 625,140 640,140 660,140 670,140 680,140 695,140 700,100 705,170 710,80 715,190 720,110 725,140 740,140 760,140 780,140 800,140 820,140 840,140 860,140 880,140 900,140">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="2s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- Heart icon (medical cross) -->
  <g transform="translate(780, 30)" opacity="0.08">
    <rect x="18" y="0" width="14" height="50" rx="3" fill="#00e68a"/>
    <rect x="0" y="18" width="50" height="14" rx="3" fill="#00e68a"/>
  </g>

  <!-- Floating medical particles -->
  <circle cx="680" cy="60" r="2" fill="#00e68a" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="220" r="1.5" fill="#00e68a" opacity="0.15">
    <animate attributeName="opacity" values="0.05;0.25;0.05" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="80" r="1" fill="#00d4ff" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Top accent line -->
  <rect x="50" y="0" width="250" height="2" fill="url(#emerald-line)" opacity="0.7"/>

  <!-- Badge: MEDICAL AI -->
  <g transform="translate(50, 30)">
    <rect width="110" height="24" rx="4" fill="#0d2818" stroke="#00e68a" stroke-width="1" opacity="0.9"/>
    <text x="55" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#00e68a" letter-spacing="2">MEDICAL AI</text>
  </g>

  <!-- Main title -->
  <text x="50" y="105" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#e6edf3" letter-spacing="-1">MedAI</text>
  <text x="50" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="300" fill="#8b949e" letter-spacing="-0.5">Longevity Platform</text>

  <!-- Subtitle -->
  <text x="50" y="190" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#00e68a" opacity="0.8">Cardiovascular Risk Prediction · Neural Network · Pure NumPy</text>

  <!-- Key metrics -->
  <g transform="translate(50, 215)">
    <rect width="100" height="36" rx="6" fill="#0d2818" stroke="#1a3a28" stroke-width="1"/>
    <text x="50" y="15" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8b949e" letter-spacing="1">ROC-AUC</text>
    <text x="50" y="30" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" font-weight="700" fill="#00e68a" filter="url(#glow)">0.675</text>
  </g>
  <g transform="translate(160, 215)">
    <rect width="100" height="36" rx="6" fill="#0d2818" stroke="#1a3a28" stroke-width="1"/>
    <text x="50" y="15" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8b949e" letter-spacing="1">DIABETES</text>
    <text x="50" y="30" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" font-weight="700" fill="#00e68a" filter="url(#glow)">0.884</text>
  </g>
  <g transform="translate(270, 215)">
    <rect width="100" height="36" rx="6" fill="#0d2818" stroke="#1a3a28" stroke-width="1"/>
    <text x="50" y="15" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8b949e" letter-spacing="1">TESTS</text>
    <text x="50" y="30" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" font-weight="700" fill="#00e68a" filter="url(#glow)">38</text>
  </g>
  <g transform="translate(380, 215)">
    <rect width="100" height="36" rx="6" fill="#0d2818" stroke="#1a3a28" stroke-width="1"/>
    <text x="50" y="15" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8b949e" letter-spacing="1">LANGUAGES</text>
    <text x="50" y="30" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" font-weight="700" fill="#00e68a" filter="url(#glow)">RU·UZ·EN</text>
  </g>

  <!-- Bottom accent -->
  <rect x="50" y="268" width="180" height="1.5" fill="url(#emerald-line)" opacity="0.4"/>

  <!-- Corner decorations -->
  <path d="M0,0 L25,0 L25,1.5 L1.5,1.5 L1.5,25 L0,25 Z" fill="#00e68a" opacity="0.12"/>
  <path d="M900,0 L875,0 L875,1.5 L898.5,1.5 L898.5,25 L900,25 Z" fill="#00e68a" opacity="0.12"/>
  <path d="M0,280 L25,280 L25,278.5 L1.5,278.5 L1.5,255 L0,255 Z" fill="#00e68a" opacity="0.12"/>
  <path d="M900,280 L875,280 L875,278.5 L898.5,278.5 L898.5,255 L900,255 Z" fill="#00e68a" opacity="0.12"/>
</svg>
